[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro"
version = "0.1.0"
description = "Motor de seguimiento en video sin doble conteo (Meta Global AI Hackathon)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10",
  "requests>=2.31",
]

[project.scripts]
rastro = "rastro.cli:main"

[tool.setuptools.packages.find]
where = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["worker"]
