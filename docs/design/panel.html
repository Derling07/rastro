<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastro · maqueta del panel (NOVA)</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1512;--panel:#17221C;--line:#2C3B33;--text:#E6EDE8;--muted:#93A69A;--pack:#F2A93B;--alta:#FF6B5B}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:16px/1.5 "Atkinson Hyperlegible",system-ui;transition:--pack .2s}
header{display:flex;gap:16px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.logo{font:700 28px "Barlow Condensed";letter-spacing:.02em}.logo span{color:var(--pack);transition:color .2s}
.chips{display:flex;gap:6px}.chip{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--pack);color:var(--ink);background:var(--pack)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--pack);outline-offset:2px}
.file{font:600 20px "Barlow Condensed";color:var(--pack)}
main{display:grid;grid-template-columns:1fr 380px;gap:1px;background:var(--line);min-height:calc(100vh - 62px)}
main>*{background:var(--ink);padding:20px}
.video{position:relative;aspect-ratio:16/9;background:#0a110d;border:1px solid var(--line);overflow:hidden;filter:grayscale(.6)}
.stamp{position:absolute;left:12px;bottom:10px;font:600 18px "Barlow Condensed";color:#cfd8d2}
.box{position:absolute;border:2px solid var(--pack);transition:opacity .3s}.box b{position:absolute;top:-24px;left:-2px;background:var(--pack);color:var(--ink);font:600 14px "Barlow Condensed";padding:1px 6px}
.timeline{margin-top:14px;height:28px;border-top:2px solid var(--line);position:relative}.timeline i{position:absolute;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--pack)}
.naive{color:var(--muted);font:600 28px "Barlow Condensed"}.naive s{text-decoration-thickness:3px}
.hero{font:700 120px/1 "Barlow Condensed";color:var(--pack);transition:color .2s}
h2{font-size:16px;color:var(--muted);margin:24px 0 8px;font-weight:700}
.alert{border-left:3px solid var(--alta);padding:6px 10px;background:var(--panel)}
.empty{color:var(--muted)}
@media (max-width:900px){main{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo">Rastr<span>o</span></div>
<div class="chips" role="group" aria-label="Paquete">
<button class="chip" data-p="fauna" aria-pressed="true">Fauna</button>
<button class="chip" data-p="transito" aria-pressed="false">Tránsito</button>
<button class="chip" data-p="multitudes" aria-pressed="false">Multitudes</button></div>
<div class="file" id="file">fauna.json</div></header>
<main><section>
<div class="video"><div class="box" style="left:11%;top:39%;width:7%;height:9%"><b>coyote-1</b></div>
<div class="box" style="left:48%;top:44%;width:8%;height:10%"><b>coyote-2</b></div>
<div class="box" style="left:70%;top:30%;width:5%;height:20%"><b>persona-1</b></div>
<div class="stamp">22:00 · Estación Norte · DSCF0104</div></div>
<div class="timeline" aria-label="Eventos"><i style="left:0"></i><i style="left:5%"></i><i style="left:20%"></i><i style="left:75%"></i></div>
<h2>Nota de voz</h2><p class="empty">Aún no hay transcripción en los outputs (pendiente del schema).</p>
</section><aside>
<div class="naive">Ingenuo <s id="naive">5</s></div>
<div class="hero" id="count" aria-live="polite">4</div>
<div id="classes">coyote 3, persona 1</div>
<h2>Alertas</h2><div id="alerts"><div class="alert">Persona detectada de noche, segundo 0:05</div></div>
<h2>Registro del agente</h2><p class="empty">Pendiente del schema.</p>
</aside></main>
<script>
const D={fauna:{c:'#F2A93B',f:'fauna.json',n:5,u:4,cl:'coyote 3, persona 1'},
transito:{c:'#C8E34A',f:'transito.json',n:null},multitudes:{c:'#5CC8E0',f:'multitudes.json',n:null}};
function roll(el,to){const from=+el.textContent||0,t0=performance.now();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;return}
 (function f(t){const k=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const d=D[b.dataset.p];
 document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
 document.documentElement.style.setProperty('--pack',d.c);document.getElementById('file').textContent=d.f;
 const has=d.n!==null;document.querySelectorAll('.box').forEach(x=>x.style.opacity=has?1:0);
 if(has){roll(count,d.u);naive.textContent=d.n;classes.textContent=d.cl;alerts.innerHTML='<div class="alert">Persona detectada de noche, segundo 0:05</div>'}
 else{count.textContent='—';naive.textContent='—';classes.textContent='Sin corrida para este video';alerts.innerHTML='<p class="empty">Sin alertas.</p>'}});
</script></body></html>
