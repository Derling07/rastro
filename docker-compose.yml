services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      # Host only. The process listens on 0.0.0.0 inside the network so
      # the web service can call http://api:8787.
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      RASTRO_BIND: "0.0.0.0"
      RASTRO_STAGE_SLEEP: "0.4"
      RASTRO_JOBS_DIR: /data/rastro-jobs
      RASTRO_WRITE_TOKEN: ${RASTRO_WRITE_TOKEN:?Set RASTRO_WRITE_TOKEN in .env}
    volumes:
      - rastro-jobs:/data/rastro-jobs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:43123:3000"
    environment:
      RASTRO_API_URL: http://api:8787
      RASTRO_WRITE_TOKEN: ${RASTRO_WRITE_TOKEN:?Set RASTRO_WRITE_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

volumes:
  rastro-jobs:
