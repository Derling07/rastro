services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      RASTRO_STAGE_SLEEP: "0.4"
      RASTRO_JOBS_DIR: /tmp/rastro-jobs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "43123:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Reach the API via the published host port. Container-to-container
      # bridge routing is blocked in some Docker setups; this path works there
      # and on Docker Desktop.
      RASTRO_API_URL: http://host.docker.internal:8787
    depends_on:
      api:
        condition: service_healthy
